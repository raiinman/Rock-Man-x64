name: Update living progress tracker

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: living-progress-main
  cancel-in-progress: false

jobs:
  update:
    if: github.event.repository.default_branch == 'main' && github.actor != 'github-actions[bot]'
    outputs:
      snapshot: ${{ steps.publish.outputs.snapshot }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TRIGGER_SHA: ${{ github.sha }}
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2; immutable tag target verified
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify a clean checkout and test documentation tooling
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          python3 -B docs/status/tools/check_generated_changes.py --clean
          python3 -B -m unittest discover -s docs/status/tools -p 'test_*.py' -v
      - name: Refresh activity and regenerate reviewed documentation
        run: |
          set -euo pipefail
          python3 -B docs/status/tools/update_tracker.py --write --refresh-activity "$TRIGGER_SHA"
          python3 -B docs/status/tools/update_tracker.py --check
          python3 -B docs/status/tools/check_generated_changes.py
      - name: Commit only generated documentation if the triggering head is still current
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ "$remote_head" != "$TRIGGER_SHA" ]; then
            echo 'A newer repository update superseded this run; nothing will be pushed.'
            exit 0
          fi
          python3 -B docs/status/tools/check_generated_changes.py
          git add -- README.md docs/status/dashboard.md docs/status/changes.md docs/status/visuals/progress-dashboard.svg docs/status/tracker-state.json
          python3 -B docs/status/tools/check_generated_changes.py
          if git diff --cached --quiet; then
            echo 'Tracker already current; no generated commit needed.'
            echo "snapshot=$TRIGGER_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: refresh generated progress tracker'
          test "$(git rev-parse HEAD^)" = "$TRIGGER_SHA"
          remote_head="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$TRIGGER_SHA" || { echo 'Head changed before push; refusing stale output.'; exit 1; }
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/main
          test "$(git ls-remote --exit-code origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          echo "snapshot=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-site:
    needs: update
    if: needs.update.outputs.snapshot != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      snapshot: ${{ steps.build.outputs.snapshot }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SNAPSHOT_SHA: ${{ needs.update.outputs.snapshot }}
    steps:
      - name: Check out the exact post-updater snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.update.outputs.snapshot }}
          fetch-depth: 1
          persist-credentials: false
      - name: Check, build and bind the public site artifact
        id: build
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SNAPSHOT_SHA"
          remote_head="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ "$remote_head" != "$SNAPSHOT_SHA" ]; then
            echo 'A newer main snapshot exists; skip this site artifact.'
            exit 0
          fi
          python3 -B docs/status/tools/check_generated_changes.py --clean
          python3 -B docs/status/tools/update_tracker.py --check
          node --test docs/web/tests/site.test.mjs
          python3 -B -m unittest discover -s docs/web/tests -p 'test_*.py' -v
          python3 -B docs/web/build_site.py --output "$RUNNER_TEMP/rockman-site" --source-revision "$SNAPSHOT_SHA"
          python3 -B docs/web/check_site.py "$RUNNER_TEMP/rockman-site" --source-revision "$SNAPSHOT_SHA"
          python3 -B docs/status/tools/check_generated_changes.py --clean
          echo "snapshot=$SNAPSHOT_SHA" >> "$GITHUB_OUTPUT"
      - name: Upload only the checked public site
        if: steps.build.outputs.snapshot != ''
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4; nested upload-artifact pinned too
        with:
          path: ${{ runner.temp }}/rockman-site
          retention-days: 1

  deploy-site:
    needs: build-site
    if: needs.build-site.outputs.snapshot != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SNAPSHOT_SHA: ${{ needs.build-site.outputs.snapshot }}
    steps:
      - name: Refuse a superseded deployment before publication
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current" = "$SNAPSHOT_SHA" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main snapshot exists; do not publish this older artifact.'
          fi
      - name: Deploy the checked documentation site
        if: steps.current.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          timeout: '540000'
